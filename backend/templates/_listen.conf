  listen {{ listen_port | default: 80 }};
{% if ipv6 -%}
  listen [::]:{{ listen_port | default: 80 }};
{% else -%}
  #listen [::]:{{ listen_port | default: 80 }};
{% endif %}
{% if certificate -%}
  listen {{ listen_port_ssl | default: 443 }} ssl;
{% if ipv6 -%}
  listen [::]:{{ listen_port_ssl | default: 443 }} ssl;
{% else -%}
  #listen [::]:{{ listen_port_ssl | default: 443 }};
{% endif %}
{% endif %}
  server_name {{ domain_names | join: " " }};
{% if http2_support == 1 or http2_support == true %}
  http2 on;
{% else -%}
  http2 off;
{% endif %}
